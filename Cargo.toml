[package]
name = "timekeep_app"
version = "2.0.0"
edition = "2021"

[dependencies]
tao = "0.28"
wry = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
calamine = "0.24"
rust_xlsxwriter = "0.68"
chrono = "0.4"
regex = "1.10"
encoding_rs = "0.8"
single-instance = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
