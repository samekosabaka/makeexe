name: Build Android 16 APK (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Tên file APK xuất ra (không cần đuôi .apk)'
        required: true
        default: 'Timekeep_Android16'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK r27 (Android 16 / 16KB Page Size)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Setup Rust & Android aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Initialize & Build Android Release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo tauri android init --ci
          cargo tauri android build --apk --target aarch64

      - name: Sign APK for Android 16 Installation
        env:
          BUILD_TOOLS: ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0
        run: |
          mkdir -p publish
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          keytool -genkeypair -v -keystore release.jks -storepass timekeep123 -keypass timekeep123 \
            -alias timekeep -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Timekeep, OU=HR, O=App, L=VN, S=VN, C=VN"

          "$BUILD_TOOLS/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass pass:timekeep123 \
            --ks-key-alias timekeep --key-pass pass:timekeep123 \
            --out "publish/${{ github.event.inputs.apk_name }}.apk" aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.apk_name }}-APK
          path: publish/${{ github.event.inputs.apk_name }}.apk