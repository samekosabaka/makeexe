name: Build EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl pyinstaller
        
    - name: Đóng gói thành file EXE
      run: pyinstaller --noconsole --onefile appv2.py
      
    - name: Tải file EXE về
      uses: actions/upload-artifact@v4
      with:
        name: PhanMemChamCongv2
        path: dist/appv2.exe
