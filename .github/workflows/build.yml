name: Build Specific App

# Kích hoạt thủ công với Menu chọn file
on:
  workflow_dispatch:
    inputs:
      app_file:
        description: 'Chọn file Python muốn đóng gói (.exe)'
        required: true
        type: choice
        options:
          - appcc.py
          - app.py
          - toolquy.py  # Thêm các tên file của bạn vào đây

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Tải mã nguồn về máy chủ
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Đóng gói App đã chọn bằng PyInstaller
      # Biến ${{ github.event.inputs.app_file }} sẽ tự động điền tên file bạn đã chọn
      run: |
        pyinstaller --onefile --windowed --icon=noface.ico --add-data "noface.ico;." ${{ github.event.inputs.app_file }}

    - name: Xuất file .exe ra mục Artifacts để tải về
      uses: actions/upload-artifact@v4
      with:
        name: EXE_${{ github.event.inputs.app_file }}
        path: dist/*.exe
