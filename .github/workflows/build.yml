name: Build Rust App to Single EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Tên file EXE xuất ra (không cần đuôi .exe)'
        required: true
        default: 'TimekeepRust'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo Build
      uses: Swatinem/rust-cache@v2

    - name: Build Release EXE
      run: |
        cargo build --release
        New-Item -ItemType Directory -Force -Path publish
        Copy-Item target\release\timekeep_app.exe "publish\${{ github.event.inputs.app_name }}.exe"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-Windows-EXE
        path: ./publish/${{ github.event.inputs.app_name }}.exe
