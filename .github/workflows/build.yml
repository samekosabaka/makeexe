name: Tự động Build theo tên File

on:
  workflow_dispatch:
    inputs:
      app_file:
        description: 'Gõ tên file Python muốn đóng gói (VD: app.py, tool.py)'
        required: true
        type: string
        default: 'app.py' # Tên file gợi ý sẵn đỡ phải gõ nhiều

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with: { python-version: '3.10' }

    - name: AI Quét và cài thư viện tự động
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pipreqs
        
        # Cách ly file bạn vừa gõ tên ra để quét thư viện
        mkdir temp_scan
        cp ${{ inputs.app_file }} temp_scan/
        pipreqs temp_scan/ --savepath temp_scan/reqs_auto.txt --force
        
        echo "=== THƯ VIỆN ĐƯỢC TỰ ĐỘNG CÀI ĐẶT ==="
        cat temp_scan/reqs_auto.txt || echo "Không có thư viện ngoài."
        
        if [ -s temp_scan/reqs_auto.txt ]; then
          pip install -r temp_scan/reqs_auto.txt
        fi

    - name: Đóng gói
      run: pyinstaller --onefile --windowed --icon=noface.ico --add-data "noface.ico;." ${{ inputs.app_file }}

    - name: Xuất file tải về
      uses: actions/upload-artifact@v4
      with:
        name: EXE_${{ inputs.app_file }}
        path: dist/*.exe
