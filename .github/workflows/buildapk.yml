name: Build Android 16 APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Ten file APK xuat ra (khong can duoi .apk)'
        required: true
        default: 'Timekeep_Android16'
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK r27
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Android Release APK
        run: |
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo tauri android init --ci

          python3 - << 'EOF'
          import glob
          kt = glob.glob("src-tauri/gen/android/app/src/main/java/**/MainActivity.kt", recursive=True)[0]
          pkg = next(l for l in open(kt) if l.startswith("package ")).strip()
          code = pkg + """

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : TauriActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val rootView = findViewById<View>(android.R.id.content)
                  ViewCompat.setOnApplyWindowInsetsListener(rootView) { view, insets ->
                      val bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                              or WindowInsetsCompat.Type.displayCutout()
                              or WindowInsetsCompat.Type.ime()
                      )
                      view.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                      WindowInsetsCompat.CONSUMED
                  }
                  ViewCompat.requestApplyInsets(rootView)
              }

              override fun onWebViewCreate(webView: WebView) {
                  super.onWebViewCreate(webView)
                  webView.addJavascriptInterface(AndroidBridge(this), "AndroidBridge")
              }

              inner class AndroidBridge(private val ctx: Context) {
                  @JavascriptInterface
                  fun saveExcel(filename: String, dataBase64: String): String {
                      return try {
                          val bytes = Base64.decode(dataBase64, Base64.DEFAULT)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val values = ContentValues().apply {
                                  put(MediaStore.Downloads.DISPLAY_NAME, filename)
                                  put(
                                      MediaStore.Downloads.MIME_TYPE,
                                      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                                  )
                                  put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                                  put(MediaStore.Downloads.IS_PENDING, 1)
                              }
                              val resolver = ctx.contentResolver
                              val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                                  ?: return "Lỗi: Không thể tạo file trong thư mục Downloads!"
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                                  ?: return "Lỗi: Không thể ghi dữ liệu file!"
                              values.clear()
                              values.put(MediaStore.Downloads.IS_PENDING, 0)
                              resolver.update(uri, values, null, null)
                              "OK: Đã lưu vào Downloads/$filename"
                          } else {
                              @Suppress("DEPRECATION")
                              val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              if (!dir.exists()) dir.mkdirs()
                              val file = File(dir, filename)
                              FileOutputStream(file).use { it.write(bytes) }
                              "OK: Đã lưu vào Downloads/$filename"
                          }
                      } catch (e: Exception) {
                          "Lỗi lưu file Excel: ${e.message}"
                      }
                  }
              }
          }
          """
          open(kt, "w").write(code)
          EOF

          if [ ! -f src-tauri/icons/32x32.png ]; then
            python3 -c 'import zlib, struct; w=h=512; raw=b"".join(b"\x00"+bytes([37,99,235,255])*w for _ in range(h)); ch=lambda t,d: struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff); open("app-icon.png","wb").write(b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack(">IIBBBBB",w,h,8,6,0,0,0))+ch(b"IDAT",zlib.compress(raw))+ch(b"IEND",b""))'
            cargo tauri icon app-icon.png
          fi
          cargo tauri android build --apk --target aarch64

      - name: Sign APK for Android 16
        run: |
          mkdir -p publish
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          keytool -genkeypair -v -keystore release.jks -storepass timekeep123 -keypass timekeep123 \
            -alias timekeep -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Timekeep, OU=HR, O=App, L=VN, S=VN, C=VN"

          "$BUILD_TOOLS/zipalign" -p -f -v 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass pass:timekeep123 \
            --ks-key-alias timekeep --key-pass pass:timekeep123 \
            --out "publish/${{ inputs.apk_name }}.apk" aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name }}-APK
          path: publish/${{ inputs.apk_name }}.apk
