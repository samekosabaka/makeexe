name: Build Desktop OTP Widget

on:
  push:
    branches: [ "main", "master" ] # Hỗ trợ cả 2 tên nhánh phổ biến
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Tải mã nguồn về máy chủ
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Đóng gói bằng PyInstaller
      # Thay đổi tên file đích thành appv10.py
      run: |
        pyinstaller --noconsole --onefile --hidden-import pystray._win32 appv10.py

    - name: Xuất file .exe ra mục Artifacts để tải về
      uses: actions/upload-artifact@v4
      with:
        name: OTP_Widget_AppV10
        # PyInstaller sẽ xuất ra file exe có tên giống hệt file py
        path: dist/appv10.exe 
