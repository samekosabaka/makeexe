name: Cleanup Old Artifacts

on:
  schedule:
    # Chạy tự động vào lúc 00:00 mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" thủ công trên giao diện GitHub

jobs:
  remove-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # Bắt buộc phải có quyền này để API của GitHub cho phép xoá artifact

    steps:
    - name: Xoá các artifact cũ
      uses: c-hive/gha-remove-artifacts@v1
      with:
        age: '7 days' # Thay đổi số ngày theo ý muốn (ví dụ: '1 month', '14 days')
        
        # Bỏ comment dòng dưới nếu bạn muốn giữ lại vĩnh viễn các artifact thuộc về một Release (có gắn tag)
        # skip-tags: true 
        
        # Bỏ comment dòng dưới nếu bạn muốn giữ lại một số lượng artifact mới nhất định bất kể tuổi của chúng
        # keep-recent: 5