[package]
name = "timekeep_app"
version = "2.1.0"
edition = "2021"

[lib]
name = "timekeep_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
calamine = "0.24"
rust_xlsxwriter = "0.68"
chrono = "0.4"
regex = "1.10"
encoding_rs = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true